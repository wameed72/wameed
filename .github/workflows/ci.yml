name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: AspNetCoreErrorDoctor

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "DevPass!2024"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'DevPass!2024' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      ERRORDOCTOR_SQL: "Server=localhost,1433;Database=ErrorDoctorCI;User Id=sa;Password=DevPass!2024;TrustServerCertificate=True;Encrypt=False"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (solution, including WPF via EnableWindowsTargeting)
        run: dotnet build --configuration Release --no-restore

      - name: Test (Core + SQL Server integration)
        run: dotnet test --configuration Release --no-build --verbosity normal
